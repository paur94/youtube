name: kids-studio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: kids_studio
    ports:
      # 5432-5434 are used by other local projects; bind to localhost only.
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d kids_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
